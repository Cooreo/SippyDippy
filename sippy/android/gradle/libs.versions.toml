# Pinned toolchain — sources: sippy/shared/docs/api-notes.md §5 (2026-11-26).
# ⚠ = could not be verified from the sandbox (maven.google.com is blocked);
#     see sippy/android/BUILD.md for the fallback if CI rejects one.
[versions]
agp = "9.5.2"
kotlin = "2.4.21"

composeUi = "1.12.1"            # androidx.compose.ui / foundation / runtime
composeMaterial3 = "1.9.0"      # ⚠
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
datastore = "1.1.7"             # ⚠ not in either reference repo
kotlinxSerialization = "1.9.0"  # ⚠ runtime for the Kotlin serialization plugin
kotlinxCoroutines = "1.10.2"    # ⚠
work = "2.10.5"                 # ⚠
backdrop = "2.0.1"              # io.github.kyant0:backdrop (verified tag + build file)
kyantShapes = "1.2.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeUi" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "composeUi" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-ripple = { module = "androidx.compose.material:material-ripple", version.ref = "composeUi" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyantShapes" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
