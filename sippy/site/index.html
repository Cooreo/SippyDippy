<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sippy — Drink consistently, joyfully</title>
    <meta
      name="description"
      content="Sippy helps you track water and every other drink you have, with friends who react to your habits, streaks, reminders and a goal you set yourself. Android 8+."
    />
    <meta property="og:title" content="Sippy — Drink consistently, joyfully" />
    <meta
      property="og:description"
      content="Track water and every other drink. Friends who react, streaks, reminders, your own goal. Android 8+."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sippy" />
    <meta property="og:url" content="%VITE_BASE%" />
    <meta property="og:image" content="%VITE_BASE%og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sippy — Drink consistently, joyfully" />
    <meta
      name="twitter:description"
      content="Track water and every other drink. Friends who react, streaks, reminders, your own goal. Android 8+."
    />
    <meta name="twitter:image" content="%VITE_BASE%og-image.png" />
    <meta name="theme-color" content="#05070D" />
    <link rel="icon" type="image/svg+xml" href="%VITE_BASE%favicon.svg" />
    <link
      rel="preload"
      href="%VITE_BASE%fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%VITE_BASE%fonts/inter-tight-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Theme boot (before first paint): stamp `.dark` so a dark-mode visitor
         never sees a light flash, then preload the wallpaper of the ACTIVE
         theme only — dark = night reef, light = daylight water. -->
    <script>
      (function () {
        var base = "%VITE_BASE%";
        var light = true;
        try {
          var stored = window.localStorage.getItem("sippy-theme");
          light = stored
            ? stored !== "dark"
            : !window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {
          /* private mode / no storage — default to light */
        }
        if (!light) document.documentElement.classList.add("dark");
        var stem = light ? "hero-caustics-light" : "hero-caustics";
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.setAttribute("fetchpriority", "high");
        link.setAttribute(
          "imagesrcset",
          base + "assets/" + stem + "-640.webp 640w, " +
            base + "assets/" + stem + "-960.webp 960w, " +
            base + "assets/" + stem + ".webp 1376w"
        );
        link.setAttribute("imagesizes", "100vw");
        link.href = base + "assets/" + stem + ".webp";
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
