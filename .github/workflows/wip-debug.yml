# TEMPORARY diagnostic workflow (deleted before the final commit).
# This sandbox cannot download Actions logs OR artifacts (both hosts are
# blocked), so failures are surfaced as check-run annotations, which
# api.github.com does return.
name: WIP android diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/3dda615e-sippydippy]

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Installed SDK packages
        shell: bash
        run: |
          set +e
          echo "sdk root: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          plats="$(ls -1 "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" 2>/dev/null | tr '\n' ' ')"
          bt="$(ls -1 "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "::error title=platforms:: ${plats}"
          echo "::error title=build-tools:: ${bt}"
      - name: Google maven versions
        shell: bash
        run: |
          set +e
          base=https://dl.google.com/dl/android/maven2
          for a in com/android/tools/build/gradle androidx/compose/material3/material3 androidx/compose/ui/ui androidx/activity/activity-compose; do
            v="$(curl -sf --max-time 25 "$base/$a/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n 12 | tr '\n' ' ')"
            echo "::error title=google:${a##*/}:: ${v:-FETCH-FAILED}"
          done
      - name: Google maven versions 2
        shell: bash
        run: |
          set +e
          base=https://dl.google.com/dl/android/maven2
          for a in androidx/core/core-ktx androidx/lifecycle/lifecycle-runtime-compose androidx/datastore/datastore-preferences androidx/work/work-runtime-ktx androidx/compose/material3/material3-android; do
            v="$(curl -sf --max-time 25 "$base/$a/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n 12 | tr '\n' ' ')"
            echo "::error title=google2:${a##*/}:: ${v:-FETCH-FAILED}"
          done
      - name: Maven Central versions
        shell: bash
        run: |
          set +e
          base=https://repo1.maven.org/maven2
          for a in org/jetbrains/kotlin/kotlin-gradle-plugin org/jetbrains/kotlinx/kotlinx-serialization-json org/jetbrains/kotlinx/kotlinx-coroutines-android io/github/kyant0/backdrop io/github/kyant0/shapes; do
            v="$(curl -sf --max-time 25 "$base/$a/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n 12 | tr '\n' ' ')"
            echo "::error title=central:${a##*/}:: ${v:-FETCH-FAILED}"
          done

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build (diagnostic)
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug > gradle.log 2>&1
          code=$?
          echo "gradle exit=$code"
          if [ $code -ne 0 ]; then
            msg="$( { grep -a -m 40 -E "^e: " gradle.log; echo '--- what went wrong ---'; sed -n '/What went wrong/,$p' gradle.log | head -60; echo '--- first errors ---'; grep -a -m 20 -E "error:|Could not (find|resolve|GET|HEAD)|No matching|not found|Unresolved|Failed to" gradle.log | head -20; } | head -160 )"
            enc="${msg//'%'/'%25'}"
            enc="${enc//$'\r'/}"
            enc="${enc//$'\n'/'%0A'}"
            echo "::error title=Gradle failure::${enc}"
          fi
          exit $code
