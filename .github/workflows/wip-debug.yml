# TEMPORARY diagnostic workflow (deleted before the final commit). It exists
# because this sandbox cannot stream Actions logs; the log is uploaded as an
# artifact instead, which the GitHub API can hand back.
name: WIP android diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/3dda615e-sippydippy]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Environment
        run: |
          {
            echo "=== java ==="; java -version 2>&1
            echo "=== sdk env ==="; echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "=== installed platforms ==="; ls "$ANDROID_HOME/platforms" 2>&1
            echo "=== installed build-tools ==="; ls "$ANDROID_HOME/build-tools" 2>&1
            echo "=== gradle ==="; ./gradlew --version 2>&1
          } > env.log 2>&1 || true
      - name: Build (diagnostic)
        run: ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug > gradle.log 2>&1 || true
      - name: Tail
        run: tail -c 200000 gradle.log | tee tail.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-logs
          path: |
            sippy/android/env.log
            sippy/android/tail.txt
          if-no-files-found: warn
