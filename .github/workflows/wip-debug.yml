# TEMPORARY diagnostic workflow (deleted before the final commit).
# This sandbox cannot download Actions logs OR artifacts (both hosts are
# blocked), so failures are surfaced as check-run annotations, which
# api.github.com does return.
name: WIP android diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/3dda615e-sippydippy]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build (diagnostic)
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug > gradle.log 2>&1
          code=$?
          echo "gradle exit=$code"
          if [ $code -ne 0 ]; then
            msg="$( { grep -a -m 40 -E "^e: " gradle.log; echo '--- what went wrong ---'; sed -n '/What went wrong/,$p' gradle.log | head -50; echo '--- first errors ---'; grep -a -m 20 -E "error:|Could not (find|resolve|GET|HEAD)|No matching|not found|Unresolved" gradle.log | head -20; } | head -120 )"
            enc="${msg//'%'/'%25'}"
            enc="${enc//$'\r'/}"
            enc="${enc//$'\n'/'%0A'}"
            echo "::error title=Gradle failure::${enc}"
          fi
          exit $code
