# Sippy Android — continuous integration (every push and pull request).
# No secrets, nothing uploaded, nothing published.
#
# Actions pinned to full commit SHAs (verified against the tags 2026-11-27):
#   actions/checkout@v4          11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-java@v4        cf277c60eb25467037889841efdb72551f06f6c3
#   gradle/actions/setup-gradle@v4  ed408507eac070d1f99cc633dbcf757c94c7933a
#   reactivecircus/android-emulator-runner@v2  a421e43855164a8197daf9d8d40fe71c6996bb0d
name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

  assemble:
    name: Assemble debug & test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Assemble debug & androidTest
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

  layout-guard:
    name: Layout guard (advisory)
    # Non-blocking: the GitHub runner emulator environment can fail independently
    # of app code (see release.yml's smoke job), while assembleDebugAndroidTest
    # above proves LayoutGuardTest compiles cleanly on every run.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare the emulator
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$(command -v sdkmanager || find "$sdk" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -z "$sdkmanager" ]; then
            echo "::warning::sdkmanager not found under $sdk — skipping emulator prep"
            exit 0
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" >/dev/null
          printf '%s\n' "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"

      - name: Run instrumented layout guard (1.0 / 1.3 / 1.5 font scales)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            cd sippy/android
            set +e
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.cooreo.sippy.LayoutGuardTest \
              > /tmp/guard.log 2>&1
            status=$?
            set -e
            cat /tmp/guard.log
            if [ "$status" -ne 0 ]; then
              python3 - <<'PY'
            import glob, xml.etree.ElementTree as ET
            found = False
            for path in sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)):
                found = True
                root = ET.parse(path).getroot()
                for tc in root.findall("testcase"):
                    fail = tc.find("failure")
                    if fail is None:
                        fail = tc.find("error")
                    if fail is not None:
                        msg = (fail.get("message") or fail.text or "").strip().replace("\n", " ")[:400]
                        print(f"::error::{tc.get('classname')}.{tc.get('name')}: {msg}")
            if not found:
                lines = [l.strip() for l in open("/tmp/guard.log").read().splitlines() if l.strip()]
                print("::error::No androidTest XML; log tail: " + " | ".join(lines[-15:])[:400])
            PY
              exit "$status"
            fi
