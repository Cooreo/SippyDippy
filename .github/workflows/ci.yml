# Sippy Android — continuous integration (every push and pull request).
# No secrets, nothing uploaded, nothing published.
#
# Actions pinned to full commit SHAs (verified against the tags 2026-11-27):
#   actions/checkout@v4          11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-java@v4        cf277c60eb25467037889841efdb72551f06f6c3
#   gradle/actions/setup-gradle@v4  ed408507eac070d1f99cc633dbcf757c94c7933a
name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Assemble debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug
