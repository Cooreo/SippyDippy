# Deploys the Sippy marketing website (sippy/site/) to GitHub Pages.
#
# The base path is derived from GITHUB_REPOSITORY (Vite `base` via the
# VITE_BASE env), so the same workflow works for <user>.github.io/<repo>/
# regardless of what the user names their public repo. Locally the default
# base is "/" (sippy/site/.env).
#
# Setup (once): repo Settings → Pages → Source: "GitHub Actions".
#
# Actions are pinned to the exact commit SHAs of their major versions
# (verified against the tags on 2026-11-26):
#   actions/checkout@v4        = 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4      = 49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/configure-pages@v5 = 983d7736d9b0ae728b81ab479565c72886d7745b
#   actions/upload-pages-artifact@v3 = 56afc609e74202658d3ffba0e8f6dda462b719fa
#   actions/deploy-pages@v4    = d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
name: Deploy Sippy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sippy/site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        working-directory: sippy/site
        run: npm ci

      # The website's download button is driven by the same manifest the app's
      # updater reads: stage it into the build. Absent on a fresh clone with no
      # release yet — the card then says "no signed build published yet".
      - name: Stage release manifest
        run: |
          mkdir -p sippy/site/public/releases
          if [ -f releases/latest.json ]; then
            cp releases/latest.json sippy/site/public/releases/latest.json
            echo "staged releases/latest.json"
          else
            echo "no releases/latest.json yet — the download card stays disabled"
          fi

      # Base path derived from GITHUB_REPOSITORY ("owner/repo" → "/repo/"),
      # so the site lands at https://<owner>.github.io/<repo>/ no matter what
      # the repo is named. Locally the default base is "/" (sippy/site/.env).
      - name: Build (base derived from GITHUB_REPOSITORY)
        working-directory: sippy/site
        run: VITE_BASE="/${GITHUB_REPOSITORY##*/}/" npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: sippy/site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
