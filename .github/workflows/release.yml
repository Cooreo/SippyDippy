# Sippy Android — signed release pipeline.
#
#   tag vX.Y.Z            -> build, smoke-test on an emulator, publish a GitHub Release
#   workflow_dispatch     -> dry run: build + smoke test, publish NOTHING
#
# Actions pinned to full commit SHAs (verified against the tags 2026-11-27):
#   actions/checkout@v4                11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-java@v4              cf277c60eb25467037889841efdb72551f06f6c3
#   gradle/actions/setup-gradle@v4     ed408507eac070d1f99cc633dbcf757c94c7933a
#   actions/upload-artifact@v4         ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact@v4       d3f86a106a0bac45b974a628896c90dbdf5c8093
#   reactivecircus/android-emulator-runner@v2  a421e43855164a8197daf9d8d40fe71c6996bb0d
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.package.outputs.apk_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
      size: ${{ steps.package.outputs.size }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Read version
        id: version
        run: |
          code="$(grep -E '^versionCode' version.properties | cut -d= -f2 | tr -d ' ')"
          name="$(grep -E '^versionName' version.properties | cut -d= -f2 | tr -d ' ')"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "version.properties says v$name ($code)"

      # Guard 3 (update-until-uninstall): a tag must match version.properties,
      # and its versionCode must be strictly higher than the published one.
      - name: Guard — tag matches version.properties
        if: github.ref_type == 'tag'
        run: |
          expected="${{ steps.version.outputs.tag }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.properties ($expected). Bump version.properties or retag."
            exit 1
          fi

      - name: Guard — versionCode is newer than the published release
        run: |
          local_code="${{ steps.version.outputs.version_code }}"
          latest="../../releases/latest.json"
          if [ ! -f "$latest" ]; then
            echo "No releases/latest.json yet — first release."
            exit 0
          fi
          remote_code="$(python3 -c "import json,sys; print(json.load(open('$latest')).get('versionCode', 0))")"
          echo "local=$local_code remote=$remote_code"
          if [ "$local_code" -le "$remote_code" ]; then
            echo "::error::versionCode $local_code is not greater than the published $remote_code. Bump version.properties."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing. Add them in Settings → Secrets → Actions (see sippy/android/BUILD.md)."
            exit 1
          fi
          keystore="$RUNNER_TEMP/sippy-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Guard 2 (install conflicts): prove what was built before it is shared.
      - name: Verify package, version and signing certificate
        id: package
        run: |
          version_name="${{ steps.version.outputs.version_name }}"
          version_code="${{ steps.version.outputs.version_code }}"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(ls -1 "$sdk/build-tools" | sort -V | tail -1)"
          aapt2="$sdk/build-tools/$build_tools/aapt2"
          apksigner="$sdk/build-tools/$build_tools/apksigner"
          echo "using build-tools $build_tools"

          src="app/build/outputs/apk/release/app-release.apk"
          [ -f "$src" ] || { echo "::error::No release APK at $src"; exit 1; }
          apk_name="sippy-$version_name.apk"
          mkdir -p dist
          cp "$src" "dist/$apk_name"

          badging="$("$aapt2" dump badging "dist/$apk_name")"
          package_name="$(printf '%s' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [ "$package_name" != "com.cooreo.sippy" ]; then
            echo "::error::APK package is '$package_name', expected com.cooreo.sippy (install conflicts)."
            exit 1
          fi
          if ! printf '%s' "$badging" | grep -q "versionCode='$version_code'"; then
            echo "::error::APK versionCode does not match version.properties ($version_code)."
            exit 1
          fi
          if ! printf '%s' "$badging" | grep -q "versionName='$version_name'"; then
            echo "::error::APK versionName does not match version.properties ($version_name)."
            exit 1
          fi

          cert="$("$apksigner" verify --print-certs "dist/$apk_name" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f' | tr -d ': ')"
          expected="$(tr -d ' \n\r' < signing/expected-cert-sha256.txt | tr 'A-F' 'a-f')"
          if printf '%s' "$expected" | grep -q 'PLACEHOLDER'; then
            echo "::error::sippy/android/signing/expected-cert-sha256.txt still holds the placeholder. Put the release certificate's SHA-256 there (lowercase hex, no colons) and commit it."
            exit 1
          fi
          if [ "$cert" != "$expected" ]; then
            echo "::error::Signing certificate mismatch. APK=$cert expected=$expected — installs would fail with an update conflict."
            exit 1
          fi
          echo "package $package_name · versionName $version_name · versionCode $version_code · cert $cert"

          sha256="$(sha256sum "dist/$apk_name" | cut -d' ' -f1)"
          size="$(stat -c %s "dist/$apk_name")"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sippy-apk
          path: sippy/android/dist/*.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sippy-apk
          path: smoke/new

      - name: Fetch previous release (upgrade test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke/old
          if [ -f releases/latest.json ]; then
            url="$(python3 -c "import json; print(json.load(open('releases/latest.json')).get('apkUrl',''))")"
            code="$(python3 -c "import json; print(json.load(open('releases/latest.json')).get('versionCode',0))")"
            if [ -n "$url" ] && [ "$code" -lt "${{ needs.build.outputs.version_code }}" ]; then
              echo "previous release: $url"
              curl -fsSL --retry 3 -o smoke/old/sippy-previous.apk "$url" || echo "::warning::could not download the previous APK; upgrade test skipped"
            fi
          fi
          ls -l smoke/old

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            set -e
            apk="$(ls smoke/new/*.apk | head -1)"
            echo "installing $apk"
            adb install -r "$apk"
            adb shell pm grant com.cooreo.sippy android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p com.cooreo.sippy -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell screencap -p /sdcard/sippy.png && adb pull /sdcard/sippy.png smoke/sippy.png || true
            pid="$(adb shell pidof com.cooreo.sippy | tr -d '\r')"
            echo "pid=$pid"
            adb logcat -b crash -d > smoke/crash.txt || true
            if [ -z "$pid" ]; then
              echo "::error::Sippy is not running after launch (boot crash)."
              exit 1
            fi
            if grep -q "Process: com.cooreo.sippy" smoke/crash.txt; then
              echo "::error::Sippy crashed during the boot test; see the crash buffer in the step log."
              tail -100 smoke/crash.txt
              exit 1
            fi
            echo "boot ok"
            if [ -f smoke/old/sippy-previous.apk ]; then
              echo "installing the previous release and upgrading over it"
              adb uninstall com.cooreo.sippy || true
              adb install smoke/old/sippy-previous.apk
              adb shell monkey -p com.cooreo.sippy -c android.intent.category.LAUNCHER 1
              sleep 8
              adb install -r "$apk"
              adb shell am start -n com.cooreo.sippy/.MainActivity
              sleep 20
              upid="$(adb shell pidof com.cooreo.sippy | tr -d '\r')"
              if [ -z "$upid" ]; then
                echo "::error::Sippy did not survive the in-place upgrade."
                exit 1
              fi
              adb logcat -b crash -d > smoke/crash-upgrade.txt || true
              if grep -q "Process: com.cooreo.sippy" smoke/crash-upgrade.txt; then
                echo "::error::Sippy crashed after the in-place upgrade."
                tail -100 smoke/crash-upgrade.txt
                exit 1
              fi
              echo "upgrade ok"
            fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ needs.build.outputs.version_name }}
          path: |
            smoke/sippy.png
            smoke/crash.txt
            smoke/crash-upgrade.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout (for the tag message)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sippy-apk
          path: dist

      - name: Check the tag is not published yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists."
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="$RUNNER_TEMP/notes.md"
          message="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" | sed '/^[[:space:]]*$/d' | head -40)"
          {
            if [ -n "$message" ]; then
              printf '%s\n\n' "$message"
            else
              printf 'Release %s\n\n' "$GITHUB_REF_NAME"
            fi
            printf 'SHA-256: \`%s\`\n\nSigned APK built by GitHub Actions. Android will ask you to confirm the install.\n' \
              "${{ needs.build.outputs.sha256 }}"
          } > "$notes_file"
          cat "$notes_file"
          apk="$(ls dist/*.apk | head -1)"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sippy ${{ needs.build.outputs.version_name }}" \
            --notes-file "$notes_file"

      - name: Verify the download URL
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/${{ needs.build.outputs.apk_name }}"
          for i in 1 2 3 4 5; do
            code="$(curl -sL -o /dev/null -w '%{http_code}' "$url")"
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::The release asset URL did not return 200: $url"
          exit 1

      - name: Update releases/*.json on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch main "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" repo
          cd repo
          python3 sippy/android/scripts/write_release_manifest.py \
            --dir . \
            --tag "$GITHUB_REF_NAME" \
            --name "${{ needs.build.outputs.version_name }}" \
            --code "${{ needs.build.outputs.version_code }}" \
            --sha "${{ needs.build.outputs.sha256 }}" \
            --size "${{ needs.build.outputs.size }}" \
            --apk "${{ needs.build.outputs.apk_name }}"
          git add releases
          git commit -m "release: $GITHUB_REF_NAME [skip ci]"
          git pull --rebase origin main
          if ! git push origin HEAD:main; then
            echo "::error::Could not push releases/*.json to main. The release exists but latest.json was not updated."
            exit 1
          fi
