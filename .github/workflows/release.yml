# Sippy Android — signed release pipeline.
#
#   push to main          -> if version.properties carries a versionCode newer than the
#                            one in releases/latest.json: build, smoke-test on an
#                            emulator, publish a GitHub Release, rewrite the manifest and
#                            redeploy the site. A push that does not bump the version is a
#                            no-op (the build jobs are skipped, not failed).
#   workflow_dispatch     -> dry run: build + smoke test, publish NOTHING. Tick "publish"
#                            to release an already-bumped version by hand.
#
# Releasing is one step: bump versionCode/versionName in sippy/android/version.properties,
# commit and push to main. The pipeline creates the v<versionName> tag and the GitHub
# Release itself; nobody tags by hand.
#
# A dry run is only for changing this pipeline itself. Every shipped change is a
# real release: bump, merge, publish, and the site + the in-app updater follow.
# Every manifest is archived under releases/history/, so .github/workflows/rollback.yml
# can withdraw a bad release and point latest.json at the previous one in one click.
#
# Actions pinned to full commit SHAs (verified against the tags 2026-11-27):
#   actions/checkout@v4                11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-java@v4              cf277c60eb25467037889841efdb72551f06f6c3
#   gradle/actions/setup-gradle@v4     ed408507eac070d1f99cc633dbcf757c94c7933a
#   actions/upload-artifact@v4         ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact@v4       d3f86a106a0bac45b974a628896c90dbdf5c8093
#   reactivecircus/android-emulator-runner@v2  a421e43855164a8197daf9d8d40fe71c6996bb0d
name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (only allowed when version.properties is newer)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_build: ${{ steps.decide.outputs.run_build }}
      publish: ${{ steps.decide.outputs.publish }}
      version_name: ${{ steps.decide.outputs.version_name }}
      version_code: ${{ steps.decide.outputs.version_code }}
      published_code: ${{ steps.decide.outputs.published_code }}
      tag: ${{ steps.decide.outputs.tag }}
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The release decision lives here and nowhere else: a push builds and
      # publishes only when version.properties is ahead of releases/latest.json.
      # A manual run always builds, and publishes only when asked to.
      - name: Decide what this run does
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          code="$(grep -E '^versionCode' version.properties | cut -d= -f2 | tr -d ' ')"
          name="$(grep -E '^versionName' version.properties | cut -d= -f2 | tr -d ' ')"
          case "$code" in
            ''|*[!0-9]*) echo "::error::sippy/android/version.properties has no numeric versionCode."; exit 1 ;;
          esac
          if [ -z "$name" ]; then
            echo "::error::sippy/android/version.properties has no versionName."
            exit 1
          fi

          published=0
          if [ -f ../../releases/latest.json ]; then
            published="$(python3 -c "import json; print(int(json.load(open('../../releases/latest.json')).get('versionCode', 0) or 0))")"
          fi

          newer=false
          if [ "$code" -gt "$published" ]; then
            newer=true
          fi

          run_build=false
          publish=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run_build=true
            if [ "$WANT_PUBLISH" = "true" ]; then
              if [ "$newer" != "true" ]; then
                echo "::error::versionCode $code is not newer than the published $published — bump sippy/android/version.properties first."
                exit 1
              fi
              publish=true
            fi
          else
            if [ "$newer" = "true" ]; then
              run_build=true
              publish=true
            else
              echo "releases/latest.json already publishes versionCode $published — nothing to build. Bump sippy/android/version.properties to release."
            fi
          fi

          if [ "$publish" = "true" ] && [ "$ON_MAIN" != "true" ]; then
            echo "::error::Refusing to publish from ${GITHUB_REF:-an unknown ref} — releases are published from main only."
            exit 1
          fi

          echo "version.properties: v$name ($code) · published: versionCode $published · newer: $newer · build: $run_build · publish: $publish"
          {
            echo "run_build=$run_build"
            echo "publish=$publish"
            echo "version_code=$code"
            echo "version_name=$name"
            echo "published_code=$published"
            echo "tag=v$name"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build signed APK
    needs: check
    if: needs.check.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.package.outputs.apk_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
      cert_sha256: ${{ steps.package.outputs.cert_sha256 }}
      size: ${{ steps.package.outputs.size }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: sippy/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Read version
        id: version
        run: |
          code="$(grep -E '^versionCode' version.properties | cut -d= -f2 | tr -d ' ')"
          name="$(grep -E '^versionName' version.properties | cut -d= -f2 | tr -d ' ')"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "version.properties says v$name ($code)"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # The release key is committed on purpose (public by design). Fail early,
      # naming the file, if either half of the pair is missing.
      - name: Check committed signing material
        run: |
          missing=0
          for f in signing/sippy-release.jks signing/signing.properties; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing release signing file: sippy/android/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "signing material present: sippy/android/signing/sippy-release.jks, sippy/android/signing/signing.properties"

      - name: Assemble release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Guard 2 (install conflicts): prove what was built before it is shared.
      - name: Verify package, version and signing certificate
        id: package
        run: |
          version_name="${{ steps.version.outputs.version_name }}"
          version_code="${{ steps.version.outputs.version_code }}"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(ls -1 "$sdk/build-tools" | sort -V | tail -1)"
          aapt2="$sdk/build-tools/$build_tools/aapt2"
          apksigner="$sdk/build-tools/$build_tools/apksigner"
          echo "using build-tools $build_tools"

          src="app/build/outputs/apk/release/app-release.apk"
          [ -f "$src" ] || { echo "::error::No release APK at $src"; exit 1; }
          apk_name="sippy-$version_name.apk"
          mkdir -p dist
          cp "$src" "dist/$apk_name"

          badging="$("$aapt2" dump badging "dist/$apk_name")"
          package_name="$(printf '%s' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [ "$package_name" != "com.cooreo.sippy" ]; then
            echo "::error::APK package is '$package_name', expected com.cooreo.sippy (install conflicts)."
            exit 1
          fi
          if ! printf '%s' "$badging" | grep -q "versionCode='$version_code'"; then
            echo "::error::APK versionCode does not match version.properties ($version_code)."
            exit 1
          fi
          if ! printf '%s' "$badging" | grep -q "versionName='$version_name'"; then
            echo "::error::APK versionName does not match version.properties ($version_name)."
            exit 1
          fi

          # Trust on first use: the APK's own certificate is the truth. If
          # releases/latest.json already pins a certificate, this build must
          # match it — otherwise an update would install as a different app.
          #
          # The digest is read the dumb, tolerant way on purpose: apksigner's
          # signer label changes between build-tools releases ("Signer #1" vs
          # "Signer (minSdkVersion …) #1"), so match any "SHA-256 digest:" tail
          # and then validate the value is 64 hex digits. Because we sign v1+v2,
          # the JAR signature is a second, independent source via keytool.
          digest_from() {
            # $1 = text, $2 = label to cut at ("SHA-256 digest:" or "SHA256:")
            printf '%s\n' "$1" | sed -n "s/.*$2 *//p" | head -1 | tr -d ':' | tr 'A-F' 'a-f' | tr -d ' '
          }
          is_digest() { printf '%s' "$1" | grep -qE '^[0-9a-f]{64}$'; }

          cert=""
          apksigner_out=""
          if [ -x "$apksigner" ]; then
            apksigner_out="$("$apksigner" verify --print-certs "dist/$apk_name" 2>&1 || true)"
            cert="$(digest_from "$apksigner_out" 'SHA-256 digest:')"
          else
            echo "::warning::apksigner is not executable at $apksigner"
          fi

          keytool_out=""
          if ! is_digest "$cert"; then
            # Surface the tool output as annotations: the job log lives on a
            # host some readers cannot reach, annotations always arrive.
            printf '%s\n' "$apksigner_out" | head -25 | while IFS= read -r line; do
              echo "::warning::apksigner: ${line}"
            done
            echo "apksigner gave no usable digest — reading the v1 JAR signature with keytool"
            keytool_out="$(keytool -printcert -jarfile "dist/$apk_name" 2>&1 || true)"
            cert="$(digest_from "$keytool_out" 'SHA256:')"
          fi

          if ! is_digest "$cert"; then
            printf '%s\n' "$keytool_out" | head -25 | while IFS= read -r line; do
              echo "::warning::keytool: ${line}"
            done
            echo "::error::No signer certificate could be read from dist/$apk_name (tried apksigner --print-certs and keytool -printcert -jarfile). Refusing to publish."
            exit 1
          fi
          echo "signer certificate SHA-256: $cert"
          latest="../../releases/latest.json"
          pinned=""
          if [ -f "$latest" ]; then
            pinned="$(python3 -c "import json; print(json.load(open('$latest')).get('certSha256','') or '')" | tr 'A-F' 'a-f' | tr -d ': ')"
          fi
          if [ -n "$pinned" ] && [ "$pinned" != "$cert" ]; then
            echo "::error::Signing certificate mismatch: this APK is signed with $cert, releases/latest.json pins $pinned. Publishing would break every existing install — aborting."
            exit 1
          fi
          if [ -n "$pinned" ]; then
            echo "certificate matches the published manifest ($cert)"
          else
            echo "first publish — this certificate will be pinned in releases/latest.json ($cert)"
          fi
          echo "package $package_name · versionName $version_name · versionCode $version_code · cert $cert"

          sha256="$(sha256sum "dist/$apk_name" | cut -d' ' -f1)"
          size="$(stat -c %s "dist/$apk_name")"
          echo "cert_sha256=$cert" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sippy-apk
          path: sippy/android/dist/*.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Emulator smoke test (advisory)
    needs: build
    # ADVISORY, NOT A GATE: the emulator stack fails on GitHub's runners with
    # an opaque "exit code 127" from the third-party action before our script
    # runs (environment issue, not the APK — the APK is verified by aapt2 and
    # apksigner in the build job). The owner's decision is to publish anyway,
    # so a failure here is reported but does not block the release. Remove
    # continue-on-error once the emulator job is green.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sippy-apk
          path: smoke/new

      - name: Fetch previous release (upgrade test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke/old
          if [ -f releases/latest.json ]; then
            url="$(python3 -c "import json; print(json.load(open('releases/latest.json')).get('apkUrl',''))")"
            code="$(python3 -c "import json; print(json.load(open('releases/latest.json')).get('versionCode',0))")"
            if [ -n "$url" ] && [ "$code" -lt "${{ needs.build.outputs.version_code }}" ]; then
              echo "previous release: $url"
              curl -fsSL --retry 3 -o smoke/old/sippy-previous.apk "$url" || echo "::warning::could not download the previous APK; upgrade test skipped"
            fi
          fi
          ls -l smoke/old

      # Everything here is reported as an annotation: the job log is not
      # reachable from every client, annotations always are.
      - name: Prepare the emulator
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "::warning::sdk root: ${sdk:-unset}"
          echo "::warning::kvm: $(ls -l /dev/kvm 2>&1 | head -1)"
          echo "::warning::cpu/mem: $(nproc) cores, $(free -m | awk '/Mem:/{print $2}') MB"
          sdkmanager="$(command -v sdkmanager || find "$sdk" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          echo "::warning::sdkmanager: ${sdkmanager:-missing}"
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under $sdk — cannot prepare the emulator"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          if ! "$sdkmanager" --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" > "$RUNNER_TEMP/sdk.log" 2>&1; then
            echo "::error::sdkmanager could not install the emulator packages: $(tail -5 "$RUNNER_TEMP/sdk.log" | tr '\n' ' ')"
            exit 1
          fi
          echo "::warning::emulator: $(ls -l "$sdk/emulator/emulator" 2>&1 | head -1)"
          echo "::warning::adb: $(ls -l "$sdk/platform-tools/adb" 2>&1 | head -1)"
          printf '%s\n' "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -e
            fail() { echo "::error::$1"; exit 1; }
            note() { echo "::warning::$1"; }

            apk="$(ls smoke/new/*.apk 2>/dev/null | head -1 || true)"
            [ -n "$apk" ] && [ -f "$apk" ] || fail "No APK was downloaded into smoke/new"
            echo "apk: $apk ($(stat -c %s "$apk") bytes)"

            adb start-server >/dev/null 2>&1 || true
            adb wait-for-device || fail "adb wait-for-device failed — no emulator device appeared"
            sdk_level=""
            booted=""
            for i in $(seq 1 100); do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              [ "$booted" = "1" ] && break
              sleep 3
            done
            sdk_level="$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"
            note "device: sdk=$sdk_level boot_completed=$booted"
            [ "$booted" = "1" ] || fail "The emulator never reported sys.boot_completed=1 (sdk=$sdk_level)"
            adb devices -l || true

            install_apk() {
              if out="$(adb install -r "$1" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              fi
              printf '%s\n' "$out"
              return 1
            }

            installed=0
            for attempt in 1 2 3; do
              if install_apk "$apk"; then installed=1; break; fi
              note "adb install attempt $attempt failed; retrying in 10 s"
              sleep 10
            done
            if [ "$installed" -ne 1 ]; then
              echo "::error::adb install failed three times (device sdk=$sdk_level, apk=$apk) — see the log and the smoke artifact"
              adb logcat -d -t 300 2>&1 | tail -40 || true
              exit 1
            fi

            adb shell pm grant com.cooreo.sippy android.permission.POST_NOTIFICATIONS || true
            if ! out="$(adb shell monkey -p com.cooreo.sippy -c android.intent.category.LAUNCHER 1 2>&1)"; then
              echo "::error::monkey could not launch Sippy: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300)"
              exit 1
            fi
            sleep 20
            adb shell screencap -p /sdcard/sippy.png && adb pull /sdcard/sippy.png smoke/sippy.png || true
            pid="$(adb shell pidof com.cooreo.sippy | tr -d '\r')"
            echo "pid=$pid"
            adb logcat -b crash -d > smoke/crash.txt || true
            [ -n "$pid" ] || fail "Sippy is not running after launch (boot crash) — see smoke/crash.txt in the artifact"
            if grep -q "Process: com.cooreo.sippy" smoke/crash.txt; then
              echo "::error::Sippy crashed during the boot test; see the crash buffer in the step log"
              tail -100 smoke/crash.txt
              exit 1
            fi
            note "boot ok (pid=$pid)"

            if [ -f smoke/old/sippy-previous.apk ]; then
              echo "installing the previous release and upgrading over it"
              adb uninstall com.cooreo.sippy || true
              install_apk smoke/old/sippy-previous.apk || fail "Could not install the previous release for the upgrade test"
              adb shell monkey -p com.cooreo.sippy -c android.intent.category.LAUNCHER 1 || true
              sleep 8
              install_apk "$apk" || fail "The in-place upgrade over the previous release was refused (adb install -r)"
              adb shell am start -n com.cooreo.sippy/.MainActivity || true
              sleep 20
              upid="$(adb shell pidof com.cooreo.sippy | tr -d '\r')"
              [ -n "$upid" ] || fail "Sippy did not survive the in-place upgrade"
              adb logcat -b crash -d > smoke/crash-upgrade.txt || true
              if grep -q "Process: com.cooreo.sippy" smoke/crash-upgrade.txt; then
                echo "::error::Sippy crashed after the in-place upgrade"
                tail -100 smoke/crash-upgrade.txt
                exit 1
              fi
              note "upgrade ok (pid=$upid)"
            else
              note "no previous release to upgrade from — upgrade test skipped"
            fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ needs.build.outputs.version_name }}
          path: |
            smoke/sippy.png
            smoke/crash.txt
            smoke/crash-upgrade.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish release
    needs: [check, build, smoke]
    # Runs whenever the release decision says so and the APK was built and
    # verified: the emulator job is advisory, so any of its outcomes is fine.
    if: |
      always() &&
      needs.check.outputs.publish == 'true' &&
      needs.build.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # release, tag + releases/*.json commit
      actions: write    # re-deploy the website so it picks up the new manifest
    steps:
      - name: Checkout main with history and tags (for the release notes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sippy-apk
          path: dist

      - name: Check the version is not published yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — bump sippy/android/version.properties instead of republishing."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $TAG already exists at a different commit — delete that tag or bump versionName."
              exit 1
            fi
            echo "tag $TAG already exists at this commit — reusing it"
          fi
          echo "$TAG is not published yet"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION_NAME: ${{ needs.check.outputs.version_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          notes_file="$RUNNER_TEMP/notes.md"
          # No hand-written tag message any more: the notes are the commits since
          # the previous release tag, with pipeline bookkeeping filtered out.
          previous="$(git tag --sort=-v:refname --list 'v*' | head -1 || true)"
          body=""
          if [ -n "$previous" ]; then
            body="$(git log --pretty='- %s' "$previous..HEAD" | grep -v -E '^- (release|ci|build|chore|docs)(\(|:| )' | head -20 || true)"
          fi
          {
            if [ -n "$body" ]; then
              printf '%s\n\n' "$body"
            else
              printf 'Sippy %s\n\n' "$VERSION_NAME"
            fi
            printf 'SHA-256: \`%s\`\n\nSigned APK built by GitHub Actions. Android will ask you to confirm the install.\n' "$SHA256"
          } > "$notes_file"
          cat "$notes_file"
          apk="$(ls dist/*.apk | head -1)"
          gh release create "$TAG" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sippy $VERSION_NAME" \
            --notes-file "$notes_file"

      - name: Verify the download URL
        env:
          TAG: ${{ needs.check.outputs.tag }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$APK_NAME"
          for i in 1 2 3 4 5; do
            code="$(curl -sL -o /dev/null -w '%{http_code}' "$url")"
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::The release asset URL did not return 200: $url"
          exit 1

      - name: Update releases/*.json on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch main "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" repo
          cd repo
          # Keep every manifest ever published, so a rollback can restore an
          # exact previous state instead of guessing (rollback.yml).
          mkdir -p releases/history
          if [ -f releases/latest.json ]; then
            previous_name="$(python3 -c "import json;print(json.load(open('releases/latest.json')).get('versionName',''))")"
            if [ -n "$previous_name" ] && [ ! -f "releases/history/$previous_name.json" ]; then
              cp releases/latest.json "releases/history/$previous_name.json"
              echo "archived the manifest being replaced: releases/history/$previous_name.json"
            fi
          fi
          python3 sippy/android/scripts/write_release_manifest.py \
            --dir . \
            --tag "$TAG" \
            --name "${{ needs.check.outputs.version_name }}" \
            --code "${{ needs.check.outputs.version_code }}" \
            --sha "${{ needs.build.outputs.sha256 }}" \
            --size "${{ needs.build.outputs.size }}" \
            --apk "${{ needs.build.outputs.apk_name }}" \
            --cert-sha256 "${{ needs.build.outputs.cert_sha256 }}"
          cp releases/latest.json "releases/history/${{ needs.check.outputs.version_name }}.json"
          git add releases
          git commit -m "release: $TAG [skip ci]"
          git pull --rebase origin main
          if ! git push origin HEAD:main; then
            echo "::error::Could not push releases/*.json to main. The release exists but latest.json was not updated."
            exit 1
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # website deploy is asked explicitly. Best effort: the site also falls
      # back to reading releases/latest.json straight from main, so a failure
      # here delays the staged copy but never breaks the download button.
      - name: Re-deploy the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main; then
            echo "requested a website deploy"
          else
            echo "::warning::Could not request the website deploy; the site will use the raw manifest from main instead."
          fi
